<!DOCTYPE html>
<!--
  词力战士 · 合集 UI + 核心玩法 Demo（高保真方向稿，非线上代码）
  内容：玩法大厅(新UI规范) / 字母射击(简版) / 词义消消乐(简版) / 统一HUD·暂停遮罩·结算(含本局错题)
  视觉 token：主蓝 #4285F4 / 成功 #34A853 / 错误 #EA4335 / 奖励 #FF9800；大字优先、卡片化。
  图标：emoji 占位（与小程序一致）；首页插画位可替换 Downloads 中的豆包图（改 SRC 即可）。
  打开：浏览器直接打开本文件即可（file://）。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>词力战士 · UI 玩法 Demo</title>
<style>
  :root{
    --p:#4285F4; --g:#34A853; --r:#EA4335; --o:#FF9800;
    --ink:#333A45; --sub:#8A94A6; --bg:#F5F7FB; --card:#fff; --line:#E6EAF2;
    --r-lg:28px; --r-md:20px; --shadow:0 6px 16px rgba(30,60,120,.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  #app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden;background:var(--bg)}

  .view{display:none;padding:0 16px 24px;animation:fade .22s}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

  /* ---------- 通用 ---------- */
  .card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:999px;
    padding:14px 22px;font-size:17px;font-weight:700;color:#fff;cursor:pointer;letter-spacing:1px}
  .btn:active{transform:scale(.97)}
  .b-p{background:var(--p)} .b-g{background:var(--g)} .b-o{background:var(--o)} .b-ghost{background:#E8EDF6;color:var(--ink)}
  .pill{display:inline-flex;align-items:center;gap:4px;background:#EEF3FD;color:var(--p);border-radius:999px;
    padding:4px 12px;font-size:13px;font-weight:600}
  .sub{color:var(--sub);font-size:13px}

  /* ---------- 顶栏（可复用 tab 底栏 + 页头） ---------- */
  header.head{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
  header.head .t{flex:1;font-size:20px;font-weight:800}
  .icon-btn{width:40px;height:40px;border-radius:14px;border:none;background:var(--card);box-shadow:var(--shadow);font-size:18px;cursor:pointer}

  /* ---------- 对局 HUD（统一） ---------- */
  .hud{display:flex;align-items:center;gap:8px;padding:10px 16px}
  .hud .lives{color:var(--r);font-size:22px;letter-spacing:2px}
  .hud .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
  .hud .combo{background:var(--o);color:#fff;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:800}
  .hud .score{font-size:17px;font-weight:800}
  .hud .pause{width:38px;height:38px;border-radius:12px;border:none;background:var(--card);box-shadow:var(--shadow);font-size:16px;cursor:pointer}

  /* ---------- 大厅 ---------- */
  .hero{position:relative;border-radius:24px;overflow:hidden;margin:10px 0 14px;color:#fff;
    background:linear-gradient(135deg,#4285F4,#5AA9E6);padding:18px}
  .hero .hi{font-size:15px;opacity:.9}
  .hero .big{font-size:26px;font-weight:900;margin:2px 0 10px}
  .hero img{display:none;max-height:110px;border-radius:14px;margin-top:8px}
  .asset{display:flex;gap:10px;margin-bottom:14px}
  .asset .box{flex:1;background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);text-align:center}
  .asset .num{font-size:22px;font-weight:900;color:var(--ink)}
  .asset .lab{font-size:12px;color:var(--sub);margin-top:2px}
  .sec{margin:18px 0 8px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px}
  .games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .game{border:none;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px 12px;cursor:pointer;text-align:left}
  .game:active{transform:scale(.98)}
  .game .ic{font-size:34px;display:block;margin-bottom:8px}
  .game b{display:block;font-size:16px}
  .game span{display:block;font-size:12px;color:var(--sub);margin-top:4px;line-height:1.4}
  .game.new{opacity:.92}
  .zones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .zone{background:var(--card);border-radius:16px;padding:12px 4px;text-align:center;box-shadow:var(--shadow);cursor:pointer}
  .zone .zi{font-size:22px} .zone div{font-size:12px;margin-top:4px;color:var(--sub)}
  .reg{position:sticky;bottom:12px;margin-top:18px;background:linear-gradient(90deg,#34A853,#7BC96F);border-radius:999px;
    color:#fff;text-align:center;padding:14px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(52,168,83,.35)}

  /* ---------- 题目/棋盘 ---------- */
  .stage{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;margin-top:6px}
  .boss{display:flex;flex-direction:column;align-items:center;padding:6px 0 12px}
  .boss .b{font-size:52px}
  .boss .word{font-size:34px;font-weight:900;letter-spacing:4px;margin-top:6px}
  .boss .blank{display:inline-block;min-width:26px;border-bottom:4px solid var(--p);color:var(--p)}
  .hint{color:var(--sub);font-size:14px;text-align:center;margin:4px 0 14px}
  .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .opt{height:64px;border-radius:16px;border:none;background:#EEF3FD;color:#2C3E72;font-size:26px;font-weight:800;cursor:pointer}
  .opt.ok{background:var(--g);color:#fff;animation:pop .3s}
  .opt.no{background:var(--r);color:#fff;animation:shake .35s}
  @keyframes pop{50%{transform:scale(1.12)}}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  /* 消消乐棋盘 */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .tile{height:82px;border-radius:16px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:#EEF3FD;color:#2C3E72;padding:6px;word-break:break-all}
  .tile.word{color:var(--p);font-size:16px;display:flex;align-items:center;justify-content:center}
  .tile.sel{outline:3px solid var(--p);outline-offset:-3px}
  .tile.hit{background:var(--g);color:#fff;opacity:0;transition:.4s;pointer-events:none}
  .tile.miss{background:var(--r);color:#fff;animation:shake .3s}

  /* ---------- 暂停遮罩（隐藏画面） ---------- */
  .mask{position:absolute;inset:0;z-index:60;background:rgba(30,50,90,.55);display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
  .mask.on{display:flex}
  .pbox{background:#fff;border-radius:24px;padding:22px 26px;text-align:center;width:80%}
  .pbox h3{margin:0 0 6px}
  .pbox .row{display:flex;gap:10px;margin-top:14px;justify-content:center}

  /* ---------- 结算 ---------- */
  .ov{position:absolute;inset:0;z-index:70;background:rgba(30,50,90,.45);display:none;align-items:center;justify-content:center}
  .ov.on{display:flex}
  .obox{width:88%;background:#fff;border-radius:24px;padding:20px;text-align:center;max-height:82%;overflow:auto}
  .stars{font-size:36px;letter-spacing:8px;color:#D9DEE8}
  .stars .on{color:var(--o)}
  .mrow{display:flex;gap:8px;margin:12px 0}
  .mrow .m{flex:1;background:#F4F7FC;border-radius:14px;padding:8px}
  .mrow .m b{display:block;font-size:20px}
  .mrow .m span{font-size:12px;color:var(--sub)}
  .errlist{margin:10px 0;text-align:left;border-top:1px dashed var(--line);padding-top:8px}
  .errlist h4{margin:0 0 6px;font-size:13px;color:var(--sub)}
  .errlist .e{font-size:13px;padding:4px 0;border-bottom:1px dotted var(--line)}
  .errlist .e b{color:var(--ink)} .errlist .e i{color:var(--sub);font-style:normal;font-size:12px}
  .btns{display:flex;gap:10px;margin-top:14px;justify-content:center}
  .toast{position:absolute;top:18%;left:50%;transform:translateX(-50%);background:rgba(30,50,90,.9);color:#fff;
    padding:10px 18px;border-radius:999px;z-index:90;display:none;font-size:14px}
  footer.tab{display:flex;position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line)}
  footer.tab button{flex:1;border:none;background:none;padding:10px 0 12px;font-size:12px;color:var(--sub);cursor:pointer}
  footer.tab button.on{color:var(--p);font-weight:800}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 玩法大厅 ============ -->
  <section id="home" class="view on">
    <header class="head"><div class="t">⚔️ 词力战士</div><span class="pill">游客</span></header>

    <div class="hero">
      <div class="hi">欢迎回来，小战士</div>
      <div class="big">打怪学字词 · 六合一闯关</div>
      <!-- 可替换插画：改 src 为 Downloads 中的豆包图（file:///… 或拷贝到本目录） -->
      <img src="file:///C:/Users/Hbb/Downloads/豆包%20(10).png" alt="hero" onerror="this.style.display='none'">
    </div>

    <div class="asset">
      <div class="box"><div class="num">⭐ 128</div><div class="lab">累计星星</div></div>
      <div class="box"><div class="num">🎖 黄金</div><div class="lab">当前段位</div></div>
      <div class="box"><div class="num">🔥 8</div><div class="lab">最高连击</div></div>
    </div>

    <div class="sec">🎮 全部玩法</div>
    <div class="games">
      <button class="game" onclick="go('play')"><span class="ic">🔫</span><b>字母射击</b><span>挖空补词 · 打跑怪兽</span></button>
      <button class="game" onclick="go('match')"><span class="ic">🃏</span><b>词义消消乐</b><span>词↔义配对消除</span></button>
      <button class="game" onclick="toast('连连看 · 规划中')"><span class="ic">🔗</span><b>词语连连看</b><span>连线配对</span></button>
      <button class="game new" onclick="toast('弹弹球 · 规划中')"><span class="ic">🏐</span><b>单词弹弹球</b><span>义球击碎</span></button>
      <button class="game new" onclick="toast('贪吃蛇 · 规划中')"><span class="ic">🐍</span><b>单词贪吃蛇</b><span>辨词进食</span></button>
      <button class="game new" onclick="toast('算24点 · 规划中')"><span class="ic">🧮</span><b>算 24 点</b><span>脑力挑战</span></button>
    </div>

    <div class="sec">📚 我的专区</div>
    <div class="zones">
      <div class="zone" onclick="toast('错题本 · 示例')"><div class="zi">📕</div><div>错题本</div></div>
      <div class="zone" onclick="toast('排行榜 · 示例')"><div class="zi">🏆</div><div>排行榜</div></div>
      <div class="zone" onclick="toast('皮肤 · 示例')"><div class="zi">🎭</div><div>形象</div></div>
      <div class="zone" onclick="toast('学习报告 · 示例')"><div class="zi">📊</div><div>报告</div></div>
    </div>

    <div class="reg" onclick="toast('同意协议后微信登录/注册')">🔐 微信登录 · 同步进度</div>
  </section>

  <!-- ============ 字母射击（简版可玩） ============ -->
  <section id="play" class="view">
    <header class="head"><button class="icon-btn" onclick="go('home')">←</button><div class="t">字母射击</div><span class="pill" id="playMode">经典</span></header>
    <div class="hud">
      <div class="lives" id="plLives">❤❤❤</div>
      <div class="mid"><div class="score" id="plScore">0</div><div class="combo" id="plCombo" style="display:none">×1</div></div>
      <button class="pause" onclick="openPause('play')">⏸</button>
    </div>
    <div class="stage">
      <div class="boss"><div class="b" id="plBoss">👾</div>
        <div class="word" id="plWord"></div>
      </div>
      <div class="hint" id="plHint"></div>
      <div class="opts" id="plOpts"></div>
    </div>
  </section>

  <!-- ============ 词义消消乐（简版可玩） ============ -->
  <section id="match" class="view">
    <header class="head"><button class="icon-btn" onclick="go('home')">←</button><div class="t">词义消消乐</div><span class="pill">配对消除</span></header>
    <div class="hud">
      <div class="lives" id="mlLives">❤❤❤</div>
      <div class="mid"><div class="score" id="mlScore">0</div><div class="combo" id="mlCombo" style="display:none">×1</div></div>
      <button class="pause" onclick="openPause('match')">⏸</button>
    </div>
    <div class="stage"><div class="grid" id="mlGrid"></div>
      <div class="hint" id="mlTip">点「词」再点它的「释义」，成对消除</div>
    </div>
  </section>

  <!-- 暂停遮罩（隐藏关卡画面） -->
  <div class="mask" id="mask">
    <div class="pbox">
      <h3>⏸ 已暂停</h3>
      <p class="sub">画面已隐藏，计时已停止</p>
      <div class="row">
        <button class="btn b-g" onclick="resumePause()">继续</button>
        <button class="btn b-ghost" onclick="go('home')">返回大厅</button>
      </div>
    </div>
  </div>

  <!-- 结算 -->
  <div class="ov" id="ov">
    <div class="obox">
      <div class="stars" id="ovStars"></div>
      <div class="mrow">
        <div class="m"><b id="ovScore">0</b><span>得分</span></div>
        <div class="m"><b id="ovCombo">0</b><span>最高连击</span></div>
        <div class="m"><b id="ovErr">0</b><span>错题</span></div>
      </div>
      <div class="errlist" id="ovErrs" style="display:none">
        <h4>本局答错（可查看释义）</h4><div id="ovErrsBox"></div>
      </div>
      <div class="btns">
        <button class="btn b-p" id="ovAgain">再来一局</button>
        <button class="btn b-ghost" onclick="go('home')">返回大厅</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <footer class="tab">
    <button id="tabHome" class="on" onclick="go('home')">🏠 大厅</button>
    <button id="tabPlay" onclick="go('play')">🔫 射击</button>
    <button id="tabMatch" onclick="go('match')">🃏 消消乐</button>
  </footer>
</div>

<script>
"use strict";
function $(id){return document.getElementById(id);}
var TO;function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(TO);TO=setTimeout(function(){e.style.display='none';},1400);}

/* ---------- 视图 ---------- */
var cur='home';
function go(v){
  if(v==='play'&&!playInited)initPlay();
  if(v==='match'&&!matchInited)initMatch();
  document.querySelectorAll('.view').forEach(function(s){s.classList.remove('on');});
  $(v==='home'?'home':v).classList.add('on'); cur=v;
  ['home','play','match'].forEach(function(k){var t=$('tab'+k.charAt(0).toUpperCase()+k.slice(1)); if(t)t.classList.toggle('on',k===v);});
}
/* 关闭暂停/结算 */
function openPause(){ $('mask').classList.add('on'); if(cur==='match')pauseMatch=true; }
function resumePause(){ $('mask').classList.remove('on'); if(cur==='match'&&pauseMatch){pauseMatch=false;tickMatch();} }

/* ---------- 通用结算（含本局错题） ---------- */
var lastGame='';
function settle(game,star,score,combo,wrongs){
  lastGame=game; var s=$('ovStars');s.innerHTML='';
  for(var i=0;i<3;i++){var sp=document.createElement('span');sp.textContent='★';sp.className=i<star?'on':'';s.appendChild(sp);}
  $('ovScore').textContent=score; $('ovCombo').textContent=combo; $('ovErr').textContent=wrongs.length;
  var eb=$('ovErrsBox'); eb.innerHTML='';
  if(wrongs.length){$('ovErrs').style.display='block';wrongs.forEach(function(w){var d=document.createElement('div');d.className='e';d.innerHTML='<b>'+w.q+'</b> <i>'+w.a+' — '+w.hint+'</i>';eb.appendChild(d);});}
  else $('ovErrs').style.display='none';
  $('ovAgain').textContent=(game==='play')?'再来一局':'再来一局';
  $('ov').classList.add('on');
}
$('ovAgain').onclick=function(){ $('ov').classList.remove('on'); if(lastGame==='play')initPlay(); else initMatch(); };

/* ================= 题库（共用） ================= */
var WORDS=[
  {w:'apple',a:'a',hint:'苹果'},{w:'book',a:'o',hint:'书'},{w:'moon',a:'o',hint:'月亮'},
  {w:'star',a:'a',hint:'星星'},{w:'river',a:'i',hint:'河流'},{w:'happy',a:'a',hint:'开心'}
];
var PAIRS=[
  {w:'apple',cn:'苹果'},{w:'book',cn:'书'},{w:'moon',cn:'月亮'},{w:'star',cn:'星星'},
  {w:'river',cn:'河流'},{w:'happy',cn:'开心'}
];

/* ================= 字母射击 ================= */
var playInited=false,P={q:null,wrongs:[],lives:3,score:0,combo:0,max:0,done:0};
function initPlay(){ playInited=true; P.wrongs=[];P.lives=3;P.score=0;P.combo=0;P.max=0;P.done=0;nextQ(); }
function nextQ(){
  var it=WORDS[Math.floor(Math.random()*WORDS.length)];
  var idx=Math.max(0,it.w.indexOf(it.a)); // 以 a 首现作挖空（示例）
  P.q={it:it,idx:idx,ans:it.a};
  $('plWord').innerHTML = it.w.split('').map(function(ch,i){return i===idx?'<span class="blank">_</span>':ch.toUpperCase();}).join('');
  $('plHint').textContent='释义：'+it.hint+'（点下方正确字母打跑怪兽）';
  var letters=[it.a];var pool='abcdefghijklmnopqrstuvwxyz';
  while(letters.length<4){var c=pool[Math.floor(Math.random()*26)];if(letters.indexOf(c)<0)letters.push(c);}
  letters=letters.sort(function(){return Math.random()-.5;});
  $('plOpts').innerHTML='';
  letters.forEach(function(l){var b=document.createElement('button');b.className='opt';b.textContent=l.toUpperCase();
    b.onclick=function(){onShot(b,l);}; $('plOpts').appendChild(b);});
}
function onShot(btn,l){
  var q=P.q,ok=(l===q.ans), opts=$('plOpts').children;
  Array.prototype.forEach.call(opts,function(b){b.disabled=true;});
  if(ok){
    btn.classList.add('ok'); P.score+=10;P.combo++;P.max=Math.max(P.max,P.combo);P.done++;
    $('plWord').innerHTML=q.it.w.toUpperCase().split('').map(function(ch,i){return i===q.idx?'<span class="blank" style="color:#34A853">'+ch+'</span>':ch;}).join('');
    $('plScore').textContent=P.score; showCombo('plCombo',P.combo);
    if(P.done>=5){settle('play',starsOf(P.lives),P.score,P.max,P.wrongs);return;}
    setTimeout(nextQ,520);
  } else {
    btn.classList.add('no'); P.lives--;P.combo=0;
    P.wrongs.push({q:q.it.w,a:q.it.a,hint:q.it.hint});
    $('plLives').textContent='❤'.repeat(Math.max(0,P.lives)); showCombo('plCombo',0);
    if(P.lives<=0){settle('play',0,P.score,P.max,P.wrongs);return;}
    setTimeout(nextQ,620);
  }
}
function starsOf(l){return l>=3?3:(l===2?2:1);}

/* ================= 消消乐 ================= */
var matchInited=false,M={wrongs:[],lives:3,score:0,combo:0,max:0,left:0,pauseMatch:false,sel:null};
function initMatch(){ matchInited=true;M.wrongs=[];M.lives=3;M.score=0;M.combo=0;M.max=0;M.sel=null;M.pauseMatch=false;
  var cards=[];PAIRS.forEach(function(p){cards.push({t:'w',k:p.w,lab:p.w,en:p.cn});cards.push({t:'c',k:p.w,lab:p.cn,en:p.w});});
  cards=cards.sort(function(){return Math.random()-.5;});
  M.cards=cards;M.left=cards.length;renderGrid();$('mlLives').textContent='❤❤❤';$('mlScore').textContent='0';showCombo('mlCombo',0);
}
function renderGrid(){var g=$('mlGrid');g.innerHTML='';M.cards.forEach(function(c,i){var b=document.createElement('button');
  b.className='tile '+(c.t==='w'?'word':'');b.textContent=c.lab;b.dataset.i=i;
  b.onclick=function(){tapTile(i,b);};g.appendChild(b);});}
function tapTile(i,el){
  if(pauseMatch||M.pauseMatch)return;
  if(!M.sel){ M.sel={i:i,el:el};el.classList.add('sel');return; }
  if(M.sel.i===i)return;
  var a=M.cards[M.sel.i],b=M.cards[i];
  if(a.k===b.k && a.t!==b.t){
    a.done=1;b.done=1; M.left-=2; M.score+=10;M.combo++;M.max=Math.max(M.max,M.combo);
    M.sel.el.classList.add('hit');el.classList.add('hit');M.sel=null;
    $('mlScore').textContent=M.score;showCombo('mlCombo',M.combo);
    if(M.left<=0){settle('match',3,M.score,M.max,M.wrongs);}
  } else {
    el.classList.add('miss');M.sel.el.classList.add('miss');M.lives--;M.combo=0;
    M.wrongs.push({q:a.en+'/'+b.en,a:a.en,hint:'词义配对'});
    $('mlLives').textContent='❤'.repeat(Math.max(0,M.lives));showCombo('mlCombo',0);
    setTimeout(function(){el.classList.remove('miss');M.sel.el.classList.remove('miss');M.sel=null;
      if(M.lives<=0){settle('match',0,M.score,M.max,M.wrongs);} },400);
  }
}
var pauseMatch=false;
function tickMatch(){ /* 演示：暂停时不计时（本 demo 无计时，占位保留节奏函数） */ }
function showCombo(id,v){var e=$(id);if(!e)return;if(v>1){e.style.display='';e.textContent='×'+v;}else e.style.display='none';}

go('home');
</script>
