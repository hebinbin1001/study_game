<!DOCTYPE html>
<!--
  词力战士 · Demo 3：极速竞技场（Speed Arena / 限时竞速爽感版）
  ============================================================================
  玩法手稿
  - 竞速答题竞技场：一局 60 秒（再来可选 45s「极限档」），限时内连续作答；
  - 答对立即进下一题（间隔 ~150ms 飞入），节奏快；
  - 得分 = 100 × 连击倍率 + 时间奖励；连击每 +1 倍率 +0.2（上限 ×3）；
  - 答错：连击清零 + 短暂 0.8s 惩罚锁（无法作答 + 卡片红闪），错误题混回题池，
    营造「惩罚性复习」与「别乱点」的紧张感；
  - 时间到结算：得分滚动 + 等级 S/A/B/C（按正确率 + 得分）→ 再来一局。
  - 可选音效：WebAudio 合成（正=上行双音 / 误=低频警示），可关。

  热感设计点
  - 时间细进度条低于 20% 变红闪 → 逼出「再快一点」的紧迫；
  - 得分大号滚动 + 连击徽标变色/弹跳 → 即时正反馈的爽点；
  - 快速作答有「剩余秒数加成」→ 奖励抢时间，而不只是点对；
  - 惩罚锁 0.8s 极短且视觉夸张 → 失误有记忆点但不劝退。
  - 视觉：深蓝紫夜场竞技场（径向霓虹 + 星尘），卡片高光描边，375 竖屏/桌面居中。
  ============================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>词力战士 · Demo 3：极速竞技场</title>
<style>
  :root{
    --bg0:#0b0e2a; --bg1:#191d4d; --ink:#eaf0ff; --sub:#8ea0d8;
    --cyan:#4fd8ff; --pink:#ff5d8f; --violet:#a78bfa; --gold:#ffd166;
    --green:#5eead4; --red:#ff5a5a;
    --card:rgba(30,36,86,.82); --line:rgba(160,180,255,.22);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 90% at 50% -10%, #2a2f7c 0%, var(--bg0) 55%, #070a20 100%);
    min-height:100vh;
    display:flex; justify-content:center;
    overflow-x:hidden;
  }
  /* 星尘装饰 */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 78% 8%,  #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 42% 66%, #9fd0ff 50%, transparent 51%),
      radial-gradient(1px 1px at 90% 46%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 8%  82%, #c3b5ff 50%, transparent 51%);
  }
  #stage{
    position:relative; width:100%; max-width:430px; min-height:100vh;
    padding:16px 18px calc(20px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column;
  }

  /* ---------- 顶栏 ---------- */
  .titlebar{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .brand{font-size:17px; font-weight:900; letter-spacing:.5px;}
  .brand .dl{color:var(--cyan);}
  .brand .st{color:var(--gold);}
  .demo-nav{font-size:11px; color:var(--sub); display:flex; gap:10px;}
  .demo-nav a{color:inherit; text-decoration:none; border-bottom:1px dashed transparent;}
  .demo-nav a:hover{color:#fff; border-bottom-color:var(--sub);}
  .demo-nav a.on{color:var(--gold);}

  .moto{
    margin:4px 0 12px; font-size:11px; letter-spacing:2px; color:var(--sub);
    display:flex; justify-content:space-between;
  }

  /* ---------- 时间带 ---------- */
  .timeband{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
  .time-num{
    font-variant-numeric:tabular-nums; font-weight:900; font-size:30px;
    min-width:64px; text-align:center; color:var(--cyan); line-height:1;
    text-shadow:0 0 14px rgba(79,216,255,.55);
  }
  .time-num.low{color:var(--red); text-shadow:0 0 14px rgba(255,90,90,.7); animation:blink .5s step-end infinite;}
  @keyframes blink{50%{opacity:.35}}
  .time-track{flex:1; height:10px; border-radius:6px; background:rgba(255,255,255,.1);
    overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,.5);}
  .time-fill{height:100%; width:100%; border-radius:6px;
    background:linear-gradient(90deg,var(--green),var(--cyan) 55%,var(--violet));
    transition:width .1s linear;}
  .time-fill.danger{background:linear-gradient(90deg,#ff7a59,var(--red)); animation:shimmer .5s linear infinite;}
  @keyframes shimmer{50%{opacity:.55}}

  /* ---------- HUD 得分/连击/失误 ---------- */
  .hud{display:flex; align-items:center; gap:12px; margin:6px 0 14px;}
  .scorebox{flex:1;}
  .score-cap{font-size:10px; letter-spacing:3px; color:var(--sub);}
  .score{font-size:40px; font-weight:900; line-height:1; font-variant-numeric:tabular-nums;
    color:#fff; text-shadow:0 0 18px rgba(79,216,255,.45);}
  .combo-chip{
    min-width:92px; padding:6px 12px; text-align:center; border-radius:14px;
    background:rgba(255,255,255,.06); border:1px solid var(--line);
    font-weight:900; color:var(--sub); font-size:15px; display:none;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
  }
  .combo-chip.on{display:block; animation:comboPop .25s ease-out;}
  @keyframes comboPop{0%{transform:scale(.6)} 60%{transform:scale(1.18)} 100%{transform:scale(1)}}
  .combo-chip.c2{color:#fff}
  .combo-chip.c3{color:var(--cyan)}
  .combo-chip.c5{color:var(--gold)}
  .combo-chip.c8{color:var(--pink)}
  .life{display:flex; gap:5px;}
  .dot{width:12px; height:12px; border-radius:50%; background:rgba(255,255,255,.14);}
  .dot.lost{background:var(--red); box-shadow:0 0 8px rgba(255,90,90,.7);}

  /* ---------- 题目卡片 ---------- */
  .stage{position:relative; display:flex; flex-direction:column; gap:14px; flex:1;}
  .qcard{
    position:relative; padding:26px 22px; border-radius:22px;
    background:var(--card); border:1px solid var(--line);
    box-shadow:0 18px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
    overflow:hidden;
  }
  .qcard::after{content:""; position:absolute; inset:0 0 auto 0; height:2px;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent); opacity:.8;}
  .qcard .qkind{font-size:10px; letter-spacing:2px; color:var(--violet); margin-bottom:10px;
    display:flex; justify-content:space-between;}
  .qcard .qtext{font-size:30px; font-weight:900; line-height:1.35; text-align:center;
    letter-spacing:1px; word-break:break-word;}
  .qcard .qtext small{display:block; font-size:13px; font-weight:500; color:var(--sub);
    margin-top:8px; letter-spacing:0;}
  .qcard.fly{animation:fly .18s ease-out;}
  @keyframes fly{0%{transform:translateY(16px); opacity:0} 100%{transform:none; opacity:1}}
  .qcard.shake{animation:shake .35s;}
  @keyframes shake{10%,90%{transform:translateX(-4px)} 30%,70%{transform:translateX(5px)} 50%{transform:translateX(-6px)}}
  .qcard.flash-correct{border-color:var(--green); box-shadow:0 0 24px rgba(94,234,212,.5), 0 18px 40px rgba(0,0,0,.4);}
  .qcard.flash-wrong{border-color:var(--red); box-shadow:0 0 24px rgba(255,90,90,.55), 0 18px 40px rgba(0,0,0,.4);}

  /* 选项 */
  .opts{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .opt{
    position:relative; min-height:64px; padding:14px 10px; border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
    border:1px solid var(--line); color:var(--ink);
    font-size:17px; font-weight:700; text-align:center; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 0 rgba(0,0,0,.25), 0 10px 20px rgba(0,0,0,.2);
    transition:transform .06s, box-shadow .06s, filter .1s;
  }
  .opt:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.25);}
  .opt span{pointer-events:none;}
  .opt.ok{background:rgba(94,234,212,.18); border-color:var(--green); color:#b9fff4; animation:okPulse .2s;}
  .opt.bad{background:rgba(255,90,90,.2); border-color:var(--red); color:#ffd;}
  @keyframes okPulse{0%{transform:scale(1)} 50%{transform:scale(1.04)}}
  .locked .opt{pointer-events:none; filter:saturate(.3) brightness(.7);}

  /* 飘分 + 全卡反馈文字 */
  .floatzone{position:relative; min-height:34px; margin-top:6px;}
  .float{position:absolute; left:50%; transform:translateX(-50%); top:0;
    font-weight:900; color:#7CFFb8; text-shadow:0 0 10px rgba(124,255,184,.6);
    animation:floatUp .9s ease-out forwards; white-space:nowrap; font-size:22px;}
  .float.warn{color:var(--red); text-shadow:0 0 10px rgba(255,90,90,.6); font-size:17px;}
  @keyframes floatUp{0%{opacity:0; transform:translate(-50%,6px) scale(.9)}
    20%{opacity:1} 100%{opacity:0; transform:translate(-50%,-30px) scale(1.05)}}

  /* 开始/结算遮罩 */
  .veil{position:fixed; inset:0; z-index:20; display:flex; align-items:center;
    justify-content:center; padding:20px; background:rgba(6,8,26,.82); backdrop-filter:blur(6px);}
  .panel{width:100%; max-width:360px; background:linear-gradient(180deg,#20265e,#141842);
    border:1px solid var(--line); border-radius:24px; padding:26px 22px; text-align:center;
    box-shadow:0 26px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.1);
    animation:panelIn .3s ease-out;}
  @keyframes panelIn{0%{transform:scale(.85); opacity:0} 100%{transform:none; opacity:1}}
  .panel h1{font-size:20px; margin:0 0 4px; letter-spacing:1px;}
  .panel h1 b{color:var(--gold)}
  .panel .p-sub{color:var(--sub); font-size:12px; margin-bottom:18px; letter-spacing:1px;}
  .panel .big-btns{display:flex; flex-direction:column; gap:12px;}
  .big-btns button{border:0; cursor:pointer; border-radius:16px; padding:15px;
    font-size:16px; font-weight:900; letter-spacing:2px; color:#0a0d22;}
  .btn-60{background:linear-gradient(180deg,#6ee7ff,#38bdf8); box-shadow:0 7px 0 #1d7ea6;}
  .btn-45{background:linear-gradient(180deg,#ffd166,#f59e0b); box-shadow:0 7px 0 #a86a08;}
  .big-btns button:active{transform:translateY(3px)}
  .panel .side{display:flex; justify-content:center; gap:14px; margin-top:14px; font-size:11px; color:var(--sub);}
  .panel .side a{color:var(--cyan); text-decoration:none}

  /* 结算统计 */
  .r-score{font-size:48px; font-weight:900; color:#fff; font-variant-numeric:tabular-nums;
    text-shadow:0 0 22px rgba(79,216,255,.5);}
  .r-rate{font-size:12px; color:var(--sub); margin:2px 0 10px;}
  .r-grade{font-size:64px; font-weight:900; line-height:1; margin:8px 0 2px;}
  .g-S{color:var(--gold); text-shadow:0 0 26px rgba(255,209,102,.7)}
  .g-A{color:var(--cyan); text-shadow:0 0 22px rgba(79,216,255,.6)}
  .g-B{color:var(--violet); text-shadow:0 0 20px rgba(167,139,250,.6)}
  .g-C{color:var(--sub)}
  .g-sub{font-size:12px; color:var(--sub); margin-bottom:14px;}
  .r-stats{display:flex; justify-content:space-around; background:rgba(255,255,255,.05);
    border-radius:14px; padding:12px 6px; margin-bottom:16px; font-size:11px; color:var(--sub);}
  .r-stats b{display:block; font-size:19px; color:#fff; margin-top:2px;}
  .sound{position:fixed; right:12px; bottom:12px; z-index:30; width:38px; height:38px;
    border-radius:50%; border:1px solid var(--line); background:rgba(20,24,60,.8);
    color:#fff; font-size:16px; cursor:pointer;}
  .foot{text-align:center; font-size:10px; color:var(--sub); margin-top:14px; letter-spacing:1px;}
</style>
</head>
<body>
<div id="stage">
  <div class="titlebar">
    <div class="brand">⚔️ 词力战士 <span class="dl">Demo 3</span> · <span class="st">极速竞技场</span></div>
    <div class="demo-nav">
      <a href="01-duolingo-style.html">01 闯关式</a>
      <a class="on" href="03-speed-arena.html">03 极速</a>
      <a href="02-boss-rush.html">02 Boss</a>
    </div>
  </div>
  <div class="moto">
    <span>⏱ 限时竞速 · 连击拉满才是王</span>
    <span>目标：1.2s 均速 · 正确率 90%+ → S</span>
  </div>

  <div class="timeband">
    <div class="time-num" id="timeNum">60</div>
    <div class="time-track"><div class="time-fill" id="timeFill"></div></div>
  </div>

  <div class="hud">
    <div class="scorebox">
      <div class="score-cap">SCORE</div>
      <div class="score" id="scoreNum">0</div>
    </div>
    <div class="combo-chip" id="comboChip"></div>
    <div class="life" id="lifeBox"></div>
  </div>

  <div class="stage">
    <div class="qcard" id="qcard">
      <div class="qkind"><span id="qKind">…</span><span id="qNo">1</span></div>
      <div class="qtext" id="qText">准备…</div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="floatzone" id="floatZone"></div>
  </div>

  <div class="foot">Demo 3 · 玩法手稿见源码注释 · 限时竞速爽感版（供产品挑选）</div>
</div>

<button class="sound" id="soundBtn" title="音效开关">♪</button>

<!-- 开始面板 -->
<div class="veil" id="veil">
  <div class="panel" id="panel"></div>
</div>

<script>
/* ============================================================
 * 词库：中英互译 / 成语选释义 / 歇后语，混合呈现
 * 歇后语题：q 展示前半句 + 下划线占位，选后半句
 * ============================================================ */
var BANK = [
  { kind:'EN', q:'苹果', a:'apple' },
  { kind:'EN', q:'香蕉', a:'banana' },
  { kind:'EN', q:'学校', a:'school' },
  { kind:'EN', q:'猫',   a:'cat' },
  { kind:'EN', q:'月亮', a:'moon' },
  { kind:'EN', q:'河流', a:'river' },
  { kind:'EN', q:'水',   a:'water' },
  { kind:'EN', q:'光',   a:'light' },
  { kind:'EN', q:'梦想', a:'dream' },
  { kind:'ZH', q:'happy', a:'开心' },
  { kind:'ZH', q:'sleep', a:'睡觉' },
  { kind:'ZH', q:'friend', a:'朋友' },
  { kind:'ID', q:'守株待兔', a:'比喻不劳而获、坐等运气' },
  { kind:'ID', q:'画蛇添足', a:'比喻多此一举、弄巧成拙' },
  { kind:'ID', q:'狐假虎威', a:'比喻借别人势力吓唬人' },
  { kind:'ID', q:'亡羊补牢', a:'比喻出了问题及时补救' },
  { kind:'XH', q:'竹篮打水', a:'一场空' },
  { kind:'XH', q:'芝麻开花', a:'节节高' },
  { kind:'XH', q:'水中捞月', a:'一场空' },
  { kind:'XH', q:'猪八戒照镜子', a:'里外不是人' }
];
var KIND_NAME = { EN:'看中文 · 选英文', ZH:'看英文 · 选中文', ID:'成语 · 选释义', XH:'歇后语 · 接下半句' };

/* 兜底干扰池：答案像英文补英文，否则补中文短语/短释义 */
var EN_FILL = ['dog','red','blue','book','tree','sun','run','big'];
var ZH_FILL = ['西瓜','桌子','跑步','彩虹','铅笔','大海','天空','快乐','睡觉','朋友'];

var S = { // 运行态
  deck: [], idx: 0, wrongDeck: [], // 待答池：答错题会放回这里“罚你再见一次”
  run: false, lockUntil: 0, endAt: 0, limit: 60,
  score: 0, show: 0, combo: 0, maxCombo: 0,
  correct: 0, wrong: 0, qNo: 0, lifeDots: [],
  reactSum: 0, qStart: 0, lastReact: 0, tween: null
};
var lastAnswerTime = 0; // 上一题切出时刻（时间奖励基准用剩余秒）

/* ---------- 视图 ---------- */
var el = {};
['timeNum','timeFill','scoreNum','comboChip','lifeBox','qcard','qKind','qNo','qText','opts','floatZone','veil','panel','soundBtn']
  .forEach(function(id){ el[id] = document.getElementById(id); });

function gradeColor(g){ return 'g-'+g; }

/* ---------- 工具 ---------- */
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0; var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function isEn(s){ return /^[a-zA-Z ]+$/.test(String(s||'')); }
function fmt(n){ return Math.round(n); }

/* ---------- WebAudio 音效 ---------- */
var soundOn = true, AC = null;
function beep(freq, t, dur, type, vol){
  if(!soundOn) return;
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol||.18, AC.currentTime+t);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime+t+dur);
    o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+t); o.stop(AC.currentTime+t+dur+.02);
  }catch(e){}
}
function sfxCorrect(){ beep(880,0,.09,'triangle',.2); beep(1318,0.08,.14,'triangle',.2); }
function sfxWrong(){ beep(180,0,.3,'sawtooth',.16); }
function sfxCombo(n){ if(n>=5) beep(1568,.0,.12,'triangle',.2); }

/* ---------- 飘字 / 卡片反馈 ---------- */
function floatText(txt, warn){
  var d = document.createElement('div');
  d.className = 'float' + (warn?' warn':'');
  d.textContent = txt;
  el.floatZone.appendChild(d);
  setTimeout(function(){ d.remove(); }, 950);
}
function replayAnim(node, cls){
  node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls);
}
function shakeCard(){ replayAnim(el.qcard,'shake'); }

/* ---------- 生命/失误标记（3 点） ---------- */
function paintLife(){
  el.lifeBox.innerHTML = '';
  for(var i=0;i<3;i++){ var d=document.createElement('div'); d.className='dot'+(i<S.lifeDots.length?' lost':''); el.lifeBox.appendChild(d); }
}

/* ---------- 题池构建（答对顺序出，答错放回尾部 = 惩罚性复习） ---------- */
function rebuildDeck(){
  S.deck = BANK.slice();
  shuffle(S.deck);
  S.wrongDeck = [];
  S.idx = 0;
}
function nextItem(){
  // 优先错误复习池（错过的题下次优先再见，增强记忆）
  if(S.wrongDeck.length){
    var w = S.wrongDeck.shift();
    S.deck.push(w);            // 放回主池尾部
  }
  if(S.idx >= S.deck.length){ S.idx = 0; shuffle(S.deck); }
  return S.deck[S.idx++];
}

/* ---------- 出题 ---------- */
function buildOptions(item){
  var right = item.a;
  var cands = [];
  // 优先同语言形态的其它答案，做教学性干扰
  BANK.forEach(function(it){ var x=it.a; if(x!==right && cands.indexOf(x)<0) cands.push(x); });
  var fill = isEn(right) ? EN_FILL : ZH_FILL;
  fill.forEach(function(x){ if(x!==right && cands.indexOf(x)<0) cands.push(x); });
  var pool = shuffle(cands.slice(0, 10)).slice(0,3);
  var opts = pool.slice();
  while(opts.length < 3){ var f=fill[(Math.random()*fill.length)|0]; if(f!==right && opts.indexOf(f)<0) opts.push(f); }
  opts.push(right);
  return shuffle(opts);
}
function renderQuestion(item, qno){
  el.qKind.textContent = (item.kind? KIND_NAME[item.kind]||'选择' : '选择');
  el.qNo.textContent = '#'+qno;
  var qhtml = esc(item.q);
  if(item.kind==='XH') qhtml += '<small>—— ? ——</small>';
  else if(item.kind==='ID') qhtml += '<small>选出对应释义</small>';
  el.qText.innerHTML = qhtml;

  var opts = buildOptions(item);
  el.opts.innerHTML = '';
  opts.forEach(function(txt){
    var b = document.createElement('div');
    b.className='opt';
    var s=document.createElement('span'); s.textContent = txt; b.appendChild(s);
    b.addEventListener('click', function(){ onAnswer(item, txt, b); });
    el.opts.appendChild(b);
  });
  replayAnim(el.qcard,'fly');
}
function esc(t){ return String(t).replace(/[&<>]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

function nextQuestion(){
  if(!S.run) return;
  S.qNo++;
  var item = nextItem();
  S.qStart = performance.now();
  renderQuestion(item, S.qNo);
}

/* ---------- 作答 ---------- */
function mult(){
  // 连击倍率：每 +1 连击 +0.2，上限 ×3
  var m = 1 + (S.combo>0 ? (S.combo-1)*0.2 : 0);
  return Math.min(3, m);
}
function onAnswer(item, chosen, btn){
  if(!S.run || performance.now() < S.lockUntil) return;
  var right = item.a === chosen;
  var rt = performance.now() - S.qStart; // 本反应耗时 ms
  S.reactSum += rt; S.reactCnt = (S.reactCnt||0) + 1; // 平均反应统计
  if(right){
    S.combo++; if(S.combo>S.maxCombo) S.maxCombo=S.combo;
    S.correct++;
    var remainSec = Math.max(0,(S.endAt - performance.now())/1000);
    var timeBonus = remainSec > 2 ? Math.min(120, Math.round((remainSec-2)*6)) : 0;
    var m = mult();
    var gain = Math.round(100*m + timeBonus);
    S.score += gain;
    // 标记正确选项
    markOption(btn,'ok');
    sfxCorrect(); sfxCombo(S.combo);
    var mtxt = m>1.01 ? ' ×'+m.toFixed(1) : '';
    floatText('+'+gain + mtxt + (timeBonus>0? ' ⏱'+timeBonus:''));
    updateScoreAnim();
    updateCombo();
    paintLife();
    // 答对 → 150ms 后下一题（切题迅速）
    var self=this;
    setTimeout(function(){ if(S.run) nextQuestion(); }, 150);
  } else {
    S.wrong++; S.combo = 0; S.lifeDots.push(1); paintLife();
    S.wrongDeck.push(item); // 错误题重新混入 → 惩罚性复习
    markOption(btn,'bad');
    // 亮出正确答案
    Array.prototype.forEach.call(el.opts.children, function(o){
      if(o.textContent===item.a) o.classList.add('ok');
    });
    el.qcard.classList.add('flash-wrong');
    setTimeout(function(){ el.qcard.classList.remove('flash-wrong'); }, 320);
    shakeCard();
    sfxWrong();
    updateCombo();
    floatText('连击中断 · 惩罚 0.8s', true);
    // 惩罚锁：无法作答 + 红闪
    S.lockUntil = performance.now() + 800;
    el.opts.parentElement.classList.add('locked');
    setTimeout(function(){
      el.opts.parentElement.classList.remove('locked');
      if(S.run) nextQuestion();
    }, 800);
  }
}
function markOption(btn, cls){ Array.prototype.forEach.call(el.opts.children,function(o){o.classList.remove('ok','bad');}); btn.classList.add(cls); }

/* ---------- 计分 / 连击视图 ---------- */
function updateScoreAnim(){
  var from = S.show, to = S.score, t0 = performance.now();
  if(S.tween) cancelAnimationFrame(S.tween);
  (function step(now){
    var p = Math.min(1,(now-t0)/180);
    S.show = Math.round(from + (to-from)*(1-Math.pow(1-p,3)));
    el.scoreNum.textContent = S.show;
    if(p<1) S.tween = requestAnimationFrame(step); else S.tween=null;
  })(t0);
}
function updateCombo(){
  var c = el.comboChip;
  if(S.combo>=2){
    c.textContent = '⚡ ×'+S.combo;
    c.style.display='block';
    c.className = 'combo-chip on c'+(S.combo>=8?8:S.combo>=5?5:S.combo>=3?3:2);
    replayAnim(c,'on');
  } else { c.style.display='none'; }
}

/* ---------- 主循环：倒计时 ---------- */
function loop(now){
  if(!S.run) return;
  var remain = (S.endAt - now)/1000;
  if(remain<=0){
    remain=0;
    endGame();
    return;
  }
  var sec = Math.ceil(remain);
  el.timeNum.textContent = sec;
  var frac = remain / S.limit;
  var fill = el.timeFill;
  fill.style.width = (frac*100).toFixed(1)+'%';
  fill.classList.toggle('danger', frac<.2 && S.run);
  el.timeNum.classList.toggle('low', frac<.2);
  requestAnimationFrame(loop);
}

/* ---------- 开始 ---------- */
function openStart(){
  S.run=false;
  var p = el.panel;
  p.innerHTML =
    '<h1>⚔️ 词力战士 <b>Demo 3</b></h1>'+
    '<div class="p-sub">极速竞技场 · 限时竞速答题</div>'+
    '<div class="big-btns">'+
      '<button class="btn-60" id="b60">▶ 60 秒 · 标准场</button>'+
      '<button class="btn-45" id="b45">🔥 45 秒 · 极限场</button>'+
    '</div>'+
    '<div class="side"><a href="01-duolingo-style.html">← 01 闯关式</a>'+
    '<a href="02-boss-rush.html">02 Boss 战 →</a></div>';
  document.getElementById('b60').onclick=function(){ startRun(60); };
  document.getElementById('b45').onclick=function(){ startRun(45); };
  el.veil.style.display='flex';
}
function startRun(limit){
  el.veil.style.display='none';
  S.limit = limit;
  S.run = true; S.score=0; S.show=0; S.combo=0; S.maxCombo=0;
  S.correct=0; S.wrong=0; S.qNo=0; S.lifeDots=[];
  S.reactSum = 0; S.reactCnt = 0;
  el.scoreNum.textContent='0';
  el.timeFill.classList.remove('danger');
  el.timeNum.classList.remove('low');
  paintLife(); updateCombo();
  rebuildDeck();
  S.endAt = performance.now() + limit*1000;
  nextQuestion();
  requestAnimationFrame(loop);
}

/* ---------- 结算 ---------- */
function rating(){
  var tot = S.correct + S.wrong;
  var rate = tot? S.correct/tot : 0;
  var grade;
  if(rate>=.9) grade='S';
  else if(rate>=.75) grade='A';
  else if(rate>=.5) grade='B';
  else grade='C';
  return { grade:grade, rate:rate };
}
function endGame(){
  S.run = false;
  var r = rating();
  var avgReact = S.reactCnt ? Math.round(S.reactSum / S.reactCnt) : 0;
  var gsub = { S:'手速与正确率双满 · 你就是竞技之王', A:'很快，再稳一点就 S 了',
    B:'节奏不错 · 盯紧连击别断', C:'热身完成 · 下一局找回手感' }[r.grade];
  var p = el.panel;
  p.innerHTML =
    '<div class="r-grade '+gradeColor(r.grade)+'">'+r.grade+'</div>'+
    '<div class="r-score" id="rScore">0</div>'+
    '<div class="r-rate">正确率 '+(r.rate*100|0)+'% · 共 '+S.correct+' 对 / '+(S.correct+S.wrong)+' 答</div>'+
    '<div class="g-sub">'+gsub+'</div>'+
    '<div class="r-stats">'+
      '<div>最高连击<b>×'+S.maxCombo+'</b></div>'+
      '<div>平均反应<b>'+avgReact+'ms</b></div>'+
      '<div>失误<b>'+S.wrong+'</b></div>'+
    '</div>'+
    '<div class="big-btns">'+
      '<button class="btn-60" id="again60">↻ 再战 60s</button>'+
      (r.grade==='S'? '<button class="btn-45" id="again45">🔥 冲击 45s 极限</button>' : '')+
    '</div>'+
    '<div class="side"><a href="01-duolingo-style.html">01 闯关式</a> · <a href="02-boss-rush.html">02 Boss 战</a></div>';
  var to = S.score, t0=performance.now();
  var num=document.getElementById('rScore');
  (function tick(now){
    var pr=(now-t0)/900; if(pr>1)pr=1;
    num.textContent = (to*(1-Math.pow(1-pr,3)))|0;
    if(pr<1) requestAnimationFrame(tick);
  })(t0);
  document.getElementById('again60').onclick=function(){ startRun(60); };
  var a45=document.getElementById('again45'); if(a45) a45.onclick=function(){ startRun(45); };
  el.veil.style.display='flex';
  if(r.grade==='S') beep(1046,.0,.1,'triangle',.18), beep(1318,.09,.1,'triangle',.18), beep(1568,.18,.2,'triangle',.2);
}

/* ---------- 音效开关 ---------- */
el.soundBtn.onclick=function(){ soundOn=!soundOn; el.soundBtn.textContent = soundOn? '♪':'✕'; el.soundBtn.style.opacity=soundOn?1:.5; };

/* ---------- 启动 ---------- */
paintLife();
openStart();
</script>
</body>
</html>
